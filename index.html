<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music Player</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .player-container { width: 100%; max-width: 400px; text-align: center; }
        
        /* テロップの設定 */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            background: #222;
            padding: 10px 0;
            margin: 10px 0;
            border-radius: 8px;
            height: 24px;
        }
        .marquee {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: scroll-text 15s linear infinite;
        }
        @keyframes scroll-text {
            0% { transform: translateX(0); }
            100% { transform: translateX(-200%); }
        }

        audio { width: 100%; margin: 20px 0; }
        .controls, .extra-controls { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        button { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
        button:active { background: #555; }
        
        .playlist { width: 100%; max-width: 400px; text-align: left; background: #1e1e1e; border-radius: 10px; padding: 10px; }
        .track-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #333; }
        .track-item.active { background: #333; color: #1db954; }
        .track-info { flex: 1; cursor: pointer; }
        .delete-btn { color: #ff4444; background: none; padding: 5px; }
        
        .upload-section { margin-top: 30px; border-top: 1px solid #333; padding-top: 20px; }
        #status { font-size: 0.8em; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

<div class="player-container">
    <h2>Music Player</h2>
    
    <div class="marquee-container">
        <div id="nowPlaying" class="marquee">再生中: なし</div>
    </div>

    <audio id="mainAudio" controls></audio>

    <div class="controls">
        <button id="prevBtn">◀︎◀︎</button>
        <button id="nextBtn">▶︎▶︎</button>
    </div>

    <div class="extra-controls">
        <button id="shuffleBtn">シャッフル OFF</button>
    </div>

    <div class="playlist" id="playlist">
        </div>

    <div class="upload-section">
        <input type="file" id="videoInput" accept="audio/*,video/*">
        <button id="convertBtn" disabled>ライブラリに追加</button>
        <p id="status"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
