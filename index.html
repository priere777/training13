<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Music App</title>
    <script src="coi-serviceworker.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #121212; color: white; text-align: center; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 15px; }
        button { background: #1db954; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; margin: 5px; }
        button:disabled { background: #555; }
        #playlist { margin-top: 20px; text-align: left; padding: 0; }
        .track-item { padding: 10px; border-bottom: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between; }
        .track-item:hover { background: #333; }
        .active { color: #1db954; font-weight: bold; }
        .controls { margin: 15px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Music Player</h1>
        <input type="file" id="videoInput" accept="video/mp4">
        <button id="convertBtn" disabled>MP3に変換して追加</button>
        <p id="status">動画を選んでください</p>

        <div class="controls">
            <audio id="mainAudio" controls></audio>
            <div>
                <button id="prevBtn">⏮ 前</button>
                <button id="nextBtn">次 ⏭</button>
                <button id="shuffleBtn">シャッフル: OFF</button>
            </div>
            <p id="nowPlaying">再生中: なし</p>
        </div>

        <hr>
        <h3>プレイリスト</h3>
        <div id="playlist"></div>
    </div>

    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
